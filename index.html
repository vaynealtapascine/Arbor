<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Arbor</title>
    <meta name="description" content="Projects, tasks and notes in one fast outline." />
    <meta name="theme-color" content="#f3f7f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Paint the right background before the app loads (no white flash in dark mode).
      try {
        var a = JSON.parse(localStorage.getItem('arbor.localAppearance') || localStorage.getItem('arbor.lastAppearance') || '{}');
        var dark = a.mode === 'dark' || (a.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (a.hue != null) document.documentElement.style.setProperty('--h', a.hue);
        if (a.tint != null) document.documentElement.style.setProperty('--t', a.tint);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Arbor needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
